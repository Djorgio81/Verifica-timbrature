<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verifica Timbratura</title>

    <style>
        :root {
            --primary: #005A9C;
            --primary-hover: #00407A;
            --danger: #d9534f;
            --danger-hover: #c9302c;
            --bg: #f8f9fa;
            --card-bg: #ffffff;
            --text: #333333;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            background-color: var(--card-bg);
            max-width: 500px;
            width: 100%;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        h1 {
            font-size: 1.5rem;
            text-align: center;
            margin-top: 0;
            color: var(--primary);
        }

        .input-section {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        input[type="time"] {
            flex-grow: 1;
            padding: 10px;
            font-size: 1.2rem;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            padding: 10px 15px;
            font-size: 1rem;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }

        .btn-add {
            background-color: var(--primary);
            color: white;
        }

        .btn-add:hover {
            background-color: var(--primary-hover);
        }

        .btn-reset {
            background-color: var(--danger);
            color: white;
            width: 100%;
            margin-top: 15px;
        }

        .btn-reset:hover {
            background-color: var(--danger-hover);
        }

        .status {
            text-align: center;
            padding: 10px;
            border-radius: 5px;
            font-weight: bold;
            margin-bottom: 20px;
            background-color: #e9ecef;
        }

        .status.in { background-color: #d4edda; color: #155724; }
        .status.out { background-color: #fff3cd; color: #856404; }

        .timestamp-list {
            list-style-type: none;
            padding: 0;
            margin: 0 0 20px 0;
        }

        .timestamp-list li {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            background-color: #f1f3f5;
            margin-bottom: 8px;
            border-radius: 5px;
            border-left: 4px solid var(--primary);
        }

        .timestamp-list li button {
            background-color: transparent;
            color: var(--danger);
            padding: 5px;
            font-size: 1.2rem;
        }

        .timestamp-list li button:hover {
            background-color: #ffe6e6;
        }

        .results {
            background-color: #e3f2fd;
            padding: 15px;
            border-radius: 5px;
            border: 1px solid #b6d4fe;
        }

        .result-item {
            margin-bottom: 12px;
            font-size: 1.1rem;
            border-bottom: 1px dashed #b6d4fe;
            padding-bottom: 8px;
        }

        .result-item:last-child {
            margin-bottom: 0;
            border-bottom: none;
            padding-bottom: 0;
        }

        .highlight {
            font-weight: bold;
            color: var(--primary);
            font-size: 1.2rem;
        }
        
        .success { color: #198754; font-weight: bold; }
        .penalty-badge { color: #d9534f; font-size: 0.85rem; display: block; margin-top: 2px;}

    </style>
</head>
<body>

    <div class="container">
        <h1>Verifica Timbratura</h1>

        <div id="statusIndicator" class="status">Inserisci la prima timbratura</div>

        <form class="input-section" onsubmit="addTime(event)">
            <input type="time" id="timeInput" required>
            <button type="submit" class="btn-add">Aggiungi</button>
        </form>

        <ul id="timestampList" class="timestamp-list"></ul>

        <div id="resultsContainer" class="results" style="display: none;">
            <div class="result-item" id="res-6h30"></div>
            <div class="result-item" id="res-7h12"></div>
            <div class="result-item" id="res-7h42"></div>
        </div>

        <button class="btn-reset" onclick="resetAll()">Cancella Tutto</button>
    </div>

    <script>
        let timestamps = [];

        const targets = {
            'res-6h30': { label: 'Obiettivo 6h 30m (Buono Pasto)', minutes: 6 * 60 + 30 },
            'res-7h12': { label: 'Obiettivo 7h 12m', minutes: 7 * 60 + 12 },
            'res-7h42': { label: 'Obiettivo 7h 42m', minutes: 7 * 60 + 42 }
        };

        function addTime(e) {
            e.preventDefault();
            const timeInput = document.getElementById('timeInput');
            const [hours, minutes] = timeInput.value.split(':').map(Number);
            const totalMinutes = hours * 60 + minutes;

            if (!timestamps.includes(totalMinutes)) {
                timestamps.push(totalMinutes);
                timestamps.sort((a, b) => a - b);
            }
            
            timeInput.value = '';
            updateUI();
        }

        function removeTime(index) {
            timestamps.splice(index, 1);
            updateUI();
        }

        function resetAll() {
            if(confirm("Vuoi cancellare tutti gli orari inseriti?")) {
                timestamps = [];
                updateUI();
            }
        }

        function formatTime(totalMinutes) {
            let h = Math.floor(totalMinutes / 60) % 24;
            let m = totalMinutes % 60;
            return `${h.toString().padStart(2, '0')}:${m.toString().padStart(2, '0')}`;
        }

        function formatDuration(totalMinutes) {
            let h = Math.floor(totalMinutes / 60);
            let m = totalMinutes % 60;
            return `${h}h ${m}m`;
        }

        function updateUI() {
            const list = document.getElementById('timestampList');
            const statusIndicator = document.getElementById('statusIndicator');
            const resultsContainer = document.getElementById('resultsContainer');

            list.innerHTML = '';

            if (timestamps.length === 0) {
                statusIndicator.className = 'status';
                statusIndicator.innerText = 'Inserisci la prima timbratura';
                resultsContainer.style.display = 'none';
                return;
            }

            resultsContainer.style.display = 'block';

            timestamps.forEach((t, index) => {
                const li = document.createElement('li');
                const action = index % 2 === 0 ? '📥 Entrata' : '📤 Uscita';
                li.innerHTML = `
                    <span><strong>${action}</strong> - ${formatTime(t)}</span>
                    <button type="button" onclick="removeTime(${index})" title="Rimuovi">✖</button>
                `;
                list.appendChild(li);
            });

            // Calcolo tempo lavorato netto accumulato e pause godute tra 13:00 (780) e 15:00 (900)
            let workedMinutes = 0;
            let b_minutes = 0; // Pausa fruita nella fascia 13-15

            for (let i = 0; i < timestamps.length; i += 2) {
                let entry = timestamps[i];
                let exit = timestamps[i+1];
                
                if (exit !== undefined) {
                    workedMinutes += (exit - entry);
                    
                    // Controlliamo il lasso di tempo fino all'entrata successiva
                    let nextEntry = timestamps[i+2];
                    if (nextEntry !== undefined) {
                        let overlapStart = Math.max(exit, 13 * 60);
                        let overlapEnd = Math.min(nextEntry, 15 * 60);
                        if (overlapStart < overlapEnd) {
                            b_minutes += (overlapEnd - overlapStart);
                        }
                    }
                }
            }

            // Penalità calcolata (se la pausa fruita è minore di 30 min)
            let missing_break = Math.max(0, 30 - b_minutes);

            const isCurrentlyWorking = timestamps.length % 2 !== 0;

            if (isCurrentlyWorking) {
                statusIndicator.className = 'status in';
                statusIndicator.innerHTML = `Stato: 🟢 <strong>IN SEDE</strong><br><small>Tempo accumulato (esclusa timbratura in corso): ${formatDuration(workedMinutes)}</small>`;
            } else {
                statusIndicator.className = 'status out';
                statusIndicator.innerHTML = `Stato: 🟡 <strong>IN PAUSA / USCITO</strong><br><small>Tempo accumulato finora: ${formatDuration(workedMinutes)}</small>`;
            }

            const lastEntryTime = isCurrentlyWorking ? timestamps[timestamps.length - 1] : null;

            for (const [id, target] of Object.entries(targets)) {
                const el = document.getElementById(id);
                
                if (isCurrentlyWorking) {
                    // Minuti netti che mancano per completare il target
                    let baseRemaining = target.minutes - workedMinutes;
                    
                    // Se avesse lavorato in continuo, uscirebbe a questa ora:
                    let baseExitTime = lastEntryTime + baseRemaining;
                    
                    let exitTime = baseExitTime;
                    let penaltyApplied = false;

                    // Se l'orario base di uscita tocca o supera le 13:00, scatta la decurtazione (se dovuta)
                    if (baseExitTime > (13 * 60) || lastEntryTime >= (13 * 60)) {
                        exitTime = baseExitTime + missing_break;
                        if (missing_break > 0) penaltyApplied = true;
                    }

                    if (exitTime <= lastEntryTime) {
                        el.innerHTML = `${target.label}: <span class="success">Completato!</span>`;
                    } else {
                        let breakBadge = penaltyApplied ? 
                            `<span class="penalty-badge">(Inclusa decurtazione pausa: -${missing_break}m)</span>` : '';
                        el.innerHTML = `${target.label}: Uscita alle <span class="highlight">${formatTime(exitTime)}</span>${breakBadge}`;
                    }
                } else {
                    // Calcolo per quando si è fuori sede
                    let remainingNet = target.minutes - workedMinutes;
                    if (remainingNet <= 0) {
                        el.innerHTML = `${target.label}: <span class="success">Completato!</span>`;
                    } else {
                        // Se rientra, la decurtazione dipenderà da quando rientra.
                        // Per non creare confusione mostriamo solo le ore nette mancanti
                        el.innerHTML = `${target.label}: Mancano <span class="highlight">${formatDuration(remainingNet)}</span> netti.`;
                    }
                }
            }
        }
    </script>
</body>
</html>
