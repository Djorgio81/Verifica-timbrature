<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verifica Timbratura</title>
    <style>
        :root {
            --primary: #005A9C;
            --primary-hover: #00407A;
            --danger: #d9534f;
            --danger-hover: #c9302c;
            --bg: #f8f9fa;
            --card-bg: #ffffff;
            --text: #333333;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            background-color: var(--card-bg);
            max-width: 500px;
            width: 100%;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        h1 {
            font-size: 1.5rem;
            text-align: center;
            margin-top: 0;
            color: var(--primary);
        }

        .input-section {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        input[type="time"] {
            flex-grow: 1;
            padding: 10px;
            font-size: 1.2rem;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            padding: 10px 15px;
            font-size: 1rem;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }

        .btn-add {
            background-color: var(--primary);
            color: white;
        }

        .btn-add:hover {
            background-color: var(--primary-hover);
        }

        .btn-reset {
            background-color: var(--danger);
            color: white;
            width: 100%;
            margin-top: 15px;
        }

        .btn-reset:hover {
            background-color: var(--danger-hover);
        }

        .status {
            text-align: center;
            padding: 10px;
            border-radius: 5px;
            font-weight: bold;
            margin-bottom: 20px;
            background-color: #e9ecef;
        }

        .status.in { background-color: #d4edda; color: #155724; }
        .status.out { background-color: #fff3cd; color: #856404; }

        .timestamp-list {
            list-style-type: none;
            padding: 0;
            margin: 0 0 20px 0;
        }

        .timestamp-list li {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            background-color: #f1f3f5;
            margin-bottom: 8px;
            border-radius: 5px;
            border-left: 4px solid var(--primary);
        }

        .timestamp-list li button {
            background-color: transparent;
            color: var(--danger);
            padding: 5px;
            font-size: 1.2rem;
        }

        .timestamp-list li button:hover {
            background-color: #ffe6e6;
        }

        .results {
            background-color: #e3f2fd;
            padding: 15px;
            border-radius: 5px;
            border: 1px solid #b6d4fe;
        }

        .result-item {
            margin-bottom: 12px;
            font-size: 1.1rem;
            border-bottom: 1px dashed #b6d4fe;
            padding-bottom: 8px;
        }

        .result-item:last-child {
            margin-bottom: 0;
            border-bottom: none;
            padding-bottom: 0;
        }

        .highlight {
            font-weight: bold;
            color: var(--primary);
            font-size: 1.2rem;
        }
        
        .success { color: #198754; font-weight: bold; }

    </style>
</head>
<body>

    <div class="container">
        <h1>Verifica Timbratura</h1>

        <div id="statusIndicator" class="status">Inserisci la prima timbratura</div>

        <form class="input-section" onsubmit="addTime(event)">
            <input type="time" id="timeInput" required>
            <button type="submit" class="btn-add">Aggiungi</button>
        </form>

        <ul id="timestampList" class="timestamp-list"></ul>

        <div id="resultsContainer" class="results" style="display: none;">
            <div class="result-item" id="res-6h30"></div>
            <div class="result-item" id="res-7h12"></div>
            <div class="result-item" id="res-7h42"></div>
        </div>

        <button class="btn-reset" onclick="resetAll()">Cancella Tutto</button>
    </div>

    <script>
        let timestamps = [];

        // Obiettivi in minuti
        const targets = {
            'res-6h30': { label: 'Obiettivo 6h 30m', minutes: 6 * 60 + 30 },
            'res-7h12': { label: 'Obiettivo 7h 12m', minutes: 7 * 60 + 12 },
            'res-7h42': { label: 'Obiettivo 7h 42m', minutes: 7 * 60 + 42 }
        };

        function addTime(e) {
            e.preventDefault();
            const timeInput = document.getElementById('timeInput');
            const [hours, minutes] = timeInput.value.split(':').map(Number);
            const totalMinutes = hours * 60 + minutes;

            // Evita doppioni esatti
            if (!timestamps.includes(totalMinutes)) {
                timestamps.push(totalMinutes);
                // Ordina cronologicamente
                timestamps.sort((a, b) => a - b);
            }
            
            timeInput.value = '';
            updateUI();
        }

        function removeTime(index) {
            timestamps.splice(index, 1);
            updateUI();
        }

        function resetAll() {
            if(confirm("Vuoi cancellare tutti gli orari inseriti?")) {
                timestamps = [];
                updateUI();
            }
        }

        function formatTime(totalMinutes) {
            let h = Math.floor(totalMinutes / 60) % 24;
            let m = totalMinutes % 60;
            return `${h.toString().padStart(2, '0')}:${m.toString().padStart(2, '0')}`;
        }

        function formatDuration(totalMinutes) {
            let h = Math.floor(totalMinutes / 60);
            let m = totalMinutes % 60;
            return `${h}h ${m}m`;
        }

        function updateUI() {
            const list = document.getElementById('timestampList');
            const statusIndicator = document.getElementById('statusIndicator');
            const resultsContainer = document.getElementById('resultsContainer');

            // Pulisce la lista
            list.innerHTML = '';

            if (timestamps.length === 0) {
                statusIndicator.className = 'status';
                statusIndicator.innerText = 'Inserisci la prima timbratura';
                resultsContainer.style.display = 'none';
                return;
            }

            resultsContainer.style.display = 'block';

            // Rigenera la lista HTML
            timestamps.forEach((t, index) => {
                const li = document.createElement('li');
                const action = index % 2 === 0 ? '📥 Entrata' : '📤 Uscita';
                li.innerHTML = `
                    <span><strong>${action}</strong> - ${formatTime(t)}</span>
                    <button type="button" onclick="removeTime(${index})" title="Rimuovi">✖</button>
                `;
                list.appendChild(li);
            });

            // Calcola il tempo accumulato
            let workedMinutes = 0;
            for (let i = 0; i < timestamps.length - 1; i += 2) {
                workedMinutes += (timestamps[i+1] - timestamps[i]);
            }

            const isCurrentlyWorking = timestamps.length % 2 !== 0;

            if (isCurrentlyWorking) {
                statusIndicator.className = 'status in';
                statusIndicator.innerHTML = 'Stato: 🟢 <strong>IN SEDE</strong>';
            } else {
                statusIndicator.className = 'status out';
                statusIndicator.innerHTML = 'Stato: 🟡 <strong>IN PAUSA / USCITO</strong><br><small>Tempo accumulato finora: ' + formatDuration(workedMinutes) + '</small>';
            }

            // Calcola le proiezioni per l'uscita
            const lastEntryTime = isCurrentlyWorking ? timestamps[timestamps.length - 1] : null;

            for (const [id, target] of Object.entries(targets)) {
                const el = document.getElementById(id);
                const remainingMinutes = target.minutes - workedMinutes;

                if (remainingMinutes <= 0) {
                    el.innerHTML = `${target.label}: <span class="success">Completato!</span>`;
                } else if (isCurrentlyWorking) {
                    const exitTime = lastEntryTime + remainingMinutes;
                    el.innerHTML = `${target.label}: Uscita alle <span class="highlight">${formatTime(exitTime)}</span>`;
                } else {
                    el.innerHTML = `${target.label}: Mancano <span class="highlight">${formatDuration(remainingMinutes)}</span> di lavoro`;
                }
            }
        }
    </script>
</body>
</html>
