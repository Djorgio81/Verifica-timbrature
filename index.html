<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verifica Timbratura v1.0</title>

    <style>
        :root {
            --primary: #005A9C;
            --primary-hover: #00407A;
            --danger: #d9534f;
            --danger-hover: #c9302c;
            --bg: #f8f9fa;
            --card-bg: #ffffff;
            --text: #333333;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            background-color: var(--card-bg);
            max-width: 500px;
            width: 100%;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        h1 {
            font-size: 1.5rem;
            text-align: center;
            margin-top: 0;
            color: var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        
        .version-badge {
            background-color: #e9ecef;
            color: #6c757d;
            font-size: 0.8rem;
            padding: 2px 8px;
            border-radius: 12px;
            font-weight: bold;
        }

        .input-section {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        input[type="time"] {
            flex-grow: 1;
            padding: 10px;
            font-size: 1.2rem;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            padding: 10px 15px;
            font-size: 1rem;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }

        .btn-add {
            background-color: var(--primary);
            color: white;
        }

        .btn-add:hover {
            background-color: var(--primary-hover);
        }

        .btn-reset {
            background-color: var(--danger);
            color: white;
            width: 100%;
            margin-top: 15px;
        }

        .btn-reset:hover {
            background-color: var(--danger-hover);
        }

        .status {
            text-align: center;
            padding: 10px;
            border-radius: 5px;
            font-weight: bold;
            margin-bottom: 20px;
            background-color: #e9ecef;
        }

        .status.in { background-color: #d4edda; color: #155724; }
        .status.out { background-color: #fff3cd; color: #856404; }

        .timestamp-list {
            list-style-type: none;
            padding: 0;
            margin: 0 0 20px 0;
        }

        .timestamp-list li {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            background-color: #f1f3f5;
            margin-bottom: 8px;
            border-radius: 5px;
            border-left: 4px solid var(--primary);
        }

        .timestamp-list li button {
            background-color: transparent;
            color: var(--danger);
            padding: 5px;
            font-size: 1.2rem;
        }

        .timestamp-list li button:hover {
            background-color: #ffe6e6;
        }

        .results {
            background-color: #e3f2fd;
            padding: 15px;
            border-radius: 5px;
            border: 1px solid #b6d4fe;
        }

        .result-item {
            margin-bottom: 15px;
            font-size: 1.1rem;
            border-bottom: 1px dashed #b6d4fe;
            padding-bottom: 10px;
        }

        .result-item:last-child {
            margin-bottom: 0;
            border-bottom: none;
            padding-bottom: 0;
        }

        .highlight {
            font-weight: bold;
            color: var(--primary);
            font-size: 1.2rem;
        }
        
        .success { color: #198754; font-weight: bold; }
        .penalty-badge { color: #6c757d; font-size: 0.85rem; display: block; margin-top: 4px; font-weight: normal; }
        .penalty-badge.red { color: #d9534f; font-weight: bold; }

    </style>
</head>
<body>

    <div class="container">
        <h1>Verifica Timbratura <span class="version-badge">v1.0</span></h1>

        <div id="statusIndicator" class="status">Inserisci la prima timbratura</div>

        <form class="input-section" onsubmit="addTime(event)">
            <input type="time" id="timeInput" required>
            <button type="submit" class="btn-add">Aggiungi</button>
        </form>

        <ul id="timestampList" class="timestamp-list"></ul>

        <div id="resultsContainer" class="results" style="display: none;">
            <div class="result-item" id="res-buono"></div>
            <div class="result-item" id="res-completo"></div>
        </div>

        <button class="btn-reset" onclick="resetAll()">Cancella Tutto</button>
    </div>

    <script>
        let timestamps = [];

        const targets = {
            'res-buono': { label: '🎫 Buono Pasto (6h 30m)', baseMinutes: 6 * 60 + 30, applyPenalty: false },
            'res-completo': { label: '🏢 Orario Completo', baseMinutes: 7 * 60 + 12, applyPenalty: true }
        };

        function addTime(e) {
            e.preventDefault();
            const timeInput = document.getElementById('timeInput');
            const [hours, minutes] = timeInput.value.split(':').map(Number);
            const totalMinutes = hours * 60 + minutes;

            if (!timestamps.includes(totalMinutes)) {
                timestamps.push(totalMinutes);
                timestamps.sort((a, b) => a - b);
            }
            
            timeInput.value = '';
            updateUI();
        }

        function removeTime(index) {
            timestamps.splice(index, 1);
            updateUI();
        }

        function resetAll() {
            if(confirm("Vuoi cancellare tutti gli orari inseriti?")) {
                timestamps = [];
                updateUI();
            }
        }

        function formatTime(totalMinutes) {
            let h = Math.floor(totalMinutes / 60) % 24;
            let m = totalMinutes % 60;
            return `${h.toString().padStart(2, '0')}:${m.toString().padStart(2, '0')}`;
        }

        function formatDuration(totalMinutes) {
            let h = Math.floor(totalMinutes / 60);
            let m = totalMinutes % 60;
            return `${h}h ${m}m`;
        }

        function updateUI() {
            const list = document.getElementById('timestampList');
            const statusIndicator = document.getElementById('statusIndicator');
            const resultsContainer = document.getElementById('resultsContainer');

            list.innerHTML = '';

            if (timestamps.length === 0) {
                statusIndicator.className = 'status';
                statusIndicator.innerText = 'Inserisci la prima timbratura';
                resultsContainer.style.display = 'none';
                return;
            }

            resultsContainer.style.display = 'block';

            timestamps.forEach((t, index) => {
                const li = document.createElement('li');
                const action = index % 2 === 0 ? '📥 Entrata' : '📤 Uscita';
                li.innerHTML = `
                    <span><strong>${action}</strong> - ${formatTime(t)}</span>
                    <button type="button" onclick="removeTime(${index})" title="Rimuovi">✖</button>
                `;
                list.appendChild(li);
            });

            // Calcolo tempo lavorato netto accumulato e pause godute ESATTAMENTE tra le 13:00 e le 15:00
            let workedMinutes = 0;
            let b_minutes = 0; 

            for (let i = 0; i < timestamps.length; i += 2) {
                let entry = timestamps[i];
                let exit = timestamps[i+1];
                
                if (exit !== undefined) {
                    workedMinutes += (exit - entry);
                    
                    let nextEntry = timestamps[i+2];
                    if (nextEntry !== undefined) {
                        let overlapStart = Math.max(exit, 13 * 60);
                        let overlapEnd = Math.min(nextEntry, 15 * 60);
                        if (overlapStart < overlapEnd) {
                            b_minutes += (overlapEnd - overlapStart);
                        }
                    }
                }
            }

            let missing_break = Math.max(0, 30 - b_minutes);
            const isCurrentlyWorking = timestamps.length % 2 !== 0;

            if (isCurrentlyWorking) {
                statusIndicator.className = 'status in';
                statusIndicator.innerHTML = `Stato: 🟢 <strong>IN SEDE</strong><br><small>Tempo netto accumulato (escluse ore in corso): ${formatDuration(workedMinutes)}</small>`;
            } else {
                statusIndicator.className = 'status out';
                statusIndicator.innerHTML = `Stato: 🟡 <strong>IN PAUSA / USCITO</strong><br><small>Tempo netto accumulato finora: ${formatDuration(workedMinutes)}</small>`;
            }

            const lastEntryTime = isCurrentlyWorking ? timestamps[timestamps.length - 1] : null;

            for (const [id, target] of Object.entries(targets)) {
                const el = document.getElementById(id);
                
                let requiredNet = target.baseMinutes;
                if (target.applyPenalty) {
                    requiredNet += missing_break; 
                }

                if (isCurrentlyWorking) {
                    let remainingNet = requiredNet - workedMinutes;
                    
                    if (remainingNet <= 0) {
                        el.innerHTML = `${target.label}: <span class="success">Completato!</span>`;
                    } else {
                        let exitTime = lastEntryTime + remainingNet;
                        
                        let badge = '';
                        if (!target.applyPenalty) {
                            badge = `<span class="penalty-badge">(Sempre 6h 30m nette, nessuna penalità)</span>`;
                        } else {
                            if (missing_break > 0) {
                                badge = `<span class="penalty-badge red">(Richiede ${formatDuration(requiredNet)} netti: include +${missing_break}m per pausa 13-15 non goduta pienamente)</span>`;
                            } else {
                                badge = `<span class="penalty-badge">(Richiede ${formatDuration(requiredNet)} netti: pausa goduta regolarmente)</span>`;
                            }
                        }

                        el.innerHTML = `${target.label}: Uscita alle <span class="highlight">${formatTime(exitTime)}</span>${badge}`;
                    }
                } else {
                    let remainingNet = requiredNet - workedMinutes;
                    if (remainingNet <= 0) {
                        el.innerHTML = `${target.label}: <span class="success">Completato!</span>`;
                    } else {
                        let badge = '';
                        if (target.applyPenalty && missing_break > 0) {
                            badge = `<span class="penalty-badge red">(Attualmente calcolati +${missing_break}m di recupero pausa)</span>`;
                        }
                        el.innerHTML = `${target.label}: Mancano <span class="highlight">${formatDuration(remainingNet)}</span> netti.${badge}`;
                    }
                }
            }
        }
    </script>
</body>
</html>
